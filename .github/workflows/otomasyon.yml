name: BIST Tarama Botu

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) Türkiye saatiyle 10:00 ile 18:00 arası saat başı çalışır.
    # (GitHub sunucuları UTC kullandığı için 07:00 - 15:00 arası yazıyoruz, bu TSİ +3'e denk gelir)
    - cron: '17 9-16 * * 1-5'
  workflow_dispatch: # Bu satır manuel olarak test edebilmemizi sağlar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodu Kopyala
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pandas-ta requests pytz matplotlib

    - name: Botu Çalıştır
      run: python bist_bot.py
